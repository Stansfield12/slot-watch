name: monitor

on:
  schedule:
    - cron: "11,41 * * * *"   # каждые 30 минут (время UTC, GitHub может задерживать запуск)
  push:
    paths:
      - trigger.txt   # запуск через коммит: в файле слово test или debug
  workflow_dispatch:
    inputs:
      debug:
        description: "Режим отладки (подробные логи, скриншоты). Только для ПРИВАТНОГО репозитория!"
        type: boolean
        default: false
      test:
        description: "Отправить тестовое сообщение в Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Read trigger mode
        run: |
          if [ -f trigger.txt ]; then echo "MODE=$(tr -d ' \r\n' < trigger.txt)" >> "$GITHUB_ENV"; fi

      - name: Run monitor
        env:
          SITE_EMAIL: ${{ secrets.SITE_EMAIL }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DAYS_AHEAD: "14"
          DEBUG: ${{ (inputs.debug || (github.event_name == 'push' && env.MODE == 'debug')) && '1' || '0' }}
          TEST: ${{ (inputs.test || (github.event_name == 'push' && env.MODE == 'test')) && '1' || '0' }}
        run: python monitor.py

      - name: Upload debug files
        if: ${{ always() && inputs.debug }}
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore

      - name: Save state
        if: ${{ always() }}
        run: |
          git config user.name "slot-watch-bot"
          git config user.email "slot-watch-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
